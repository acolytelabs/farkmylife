<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fark_my_life">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>fark_my_life</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Ensure Flutter canvas gets keyboard focus
    window.addEventListener('load', function() {
      setTimeout(function() {
        var canvas = document.querySelector('flt-glass-pane') || document.querySelector('canvas');
        if (canvas) {
          canvas.setAttribute('tabindex', '0');
          canvas.focus();
          canvas.addEventListener('click', function() { canvas.focus(); });
        }
        // Fallback: focus the body and forward keys
        document.body.setAttribute('tabindex', '0');
        document.body.focus();
        document.addEventListener('click', function() {
          var c = document.querySelector('flt-glass-pane') || document.querySelector('canvas');
          if (c) c.focus();
        });
      }, 1000);
    });
    // Prevent browser shortcuts from stealing focus
    window.addEventListener('keydown', function(e) {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyE', 'KeyW', 'KeyI', 'KeyQ', 'Tab'].includes(e.code)) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
