<!DOCTYPE html>
<html>
<head>
  <base href="/farkmylife/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fark My Life - A dice RPG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fark My Life">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Fark My Life</title>
  <link rel="manifest" href="manifest.json">
  <style>body { margin: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('keydown', function(e) {
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
           'KeyE','KeyW','KeyI','KeyQ','KeyR','KeyP','Tab','Escape',
           'Enter','ShiftLeft','ShiftRight',
           'Digit1','Digit2','Digit3','Digit4','Digit5',
           'Digit6','Digit7','Digit8','Digit9'
          ].includes(e.code)) {
        e.preventDefault();
      }
    }, { capture: true });

    // Simulate Tab press to give Flutter keyboard focus
    function sendTab() {
      window.dispatchEvent(new KeyboardEvent('keydown', {key:'Tab', code:'Tab', keyCode:9, bubbles:true}));
      window.dispatchEvent(new KeyboardEvent('keyup', {key:'Tab', code:'Tab', keyCode:9, bubbles:true}));
    }

    // On load: repeated Tab to ensure Flutter gets focus
    window.addEventListener('load', function() {
      setTimeout(sendTab, 800);
      setTimeout(sendTab, 1500);
      setTimeout(sendTab, 3000);
    });

    // Every 500ms: if no element inside Flutter has focus, send Tab
    setInterval(function() {
      var active = document.activeElement;
      // If focus is on body or html, Flutter lost it
      if (!active || active === document.body || active === document.documentElement) {
        sendTab();
      }
    }, 500);

    // On any click, also send Tab
    document.addEventListener('click', function() {
      setTimeout(sendTab, 50);
    });
  </script>
</body>
</html>
