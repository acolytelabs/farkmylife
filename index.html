<!DOCTYPE html>
<html>
<head>
  <base href="/farkmylife/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fark My Life - A dice RPG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fark My Life">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Fark My Life</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Prevent browser from intercepting game keys (scroll, tab-switch, etc.)
    window.addEventListener('keydown', function(e) {
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
           'KeyE','KeyW','KeyI','KeyQ','KeyR','KeyP','Tab','Escape',
           'Enter','ShiftLeft','ShiftRight',
           'Digit1','Digit2','Digit3','Digit4','Digit5',
           'Digit6','Digit7','Digit8','Digit9'
          ].includes(e.code)) {
        e.preventDefault();
      }
    }, { capture: true });
  </script>
</body>
</html>
