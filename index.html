<!DOCTYPE html>
<html>
<head>
  <base href="/farkmylife/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fark My Life - A dice RPG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fark My Life">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Fark My Life</title>
  <link rel="manifest" href="manifest.json">
  <style>body { margin: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Prevent browser from stealing game keys
    window.addEventListener('keydown', function(e) {
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
           'KeyE','KeyW','KeyI','KeyQ','KeyR','KeyP','Tab','Escape',
           'Enter','ShiftLeft','ShiftRight',
           'Digit1','Digit2','Digit3','Digit4','Digit5',
           'Digit6','Digit7','Digit8','Digit9'
          ].includes(e.code)) {
        e.preventDefault();
      }
    }, { capture: true });

    // Focus management
    function sendTab() {
      window.dispatchEvent(new KeyboardEvent('keydown', {key:'Tab', code:'Tab', keyCode:9, bubbles:true}));
      window.dispatchEvent(new KeyboardEvent('keyup', {key:'Tab', code:'Tab', keyCode:9, bubbles:true}));
    }
    window.addEventListener('load', function() {
      setTimeout(sendTab, 800);
      setTimeout(sendTab, 1500);
      setTimeout(sendTab, 3000);
    });
    setInterval(function() {
      var active = document.activeElement;
      if (!active || active === document.body || active === document.documentElement) sendTab();
    }, 500);
    document.addEventListener('click', function() { setTimeout(sendTab, 50); });

    // ═══════════════════════════════════════════════════════════════
    // MULTIPLAYER FETCH HELPER
    // Called from Dart via JS interop. Returns response text or null.
    // ═══════════════════════════════════════════════════════════════
    async function _fmlFetch(url, method, body) {
      try {
        var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = body;
        var resp = await fetch(url, opts);
        if (!resp.ok) return null;
        return await resp.text();
      } catch (e) {
        return null;
      }
    }
  </script>
</body>
</html>
